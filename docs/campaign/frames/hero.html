<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hero — roster-flow</title>
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body class="frame-body">
    <div class="canvas" id="frame">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-name">roster<span>-flow</span></div>
        </div>
        <div class="meta-pills">
          <span class="pill accent">Seat rail</span>
          <span class="pill on">Named agents</span>
        </div>
      </header>

      <div class="inv-rail" aria-label="Seat rail">
        <div class="inv-slot gw"><span class="role">Owner</span><span class="host">you</span><span class="led"></span></div>
        <div class="inv-slot ok"><span class="role">Architect</span><span class="host">seat</span><span class="led"></span></div>
        <div class="inv-slot ok"><span class="role">Researcher</span><span class="host">seat</span><span class="led"></span></div>
        <div class="inv-slot sealed"><span class="role">Editor</span><span class="host">seat</span><span class="led"></span></div>
        <div class="inv-slot empty"><span class="role">Empty</span><span class="host">open seat</span><span class="led"></span></div>
      </div>
      <div class="main two-col" style="margin-top: 28px">
        <div class="stack" style="gap: 22px; padding-top: 8px">
          <div>
            <p class="eyebrow">Roster · seats · timeline</p>
            <h1 class="display">Name the seats.<br /><em>Keep the timeline.</em></h1>
          </div>
          <p class="lede">A room of named agents. The deliverable is the point. Chat is a side channel.</p>
        </div>
      </div>

      <footer class="frame-foot">
        <span>Campaign</span>
        <span>Hero — roster-flow</span>
      </footer>
    </div>
  </body>
</html>
